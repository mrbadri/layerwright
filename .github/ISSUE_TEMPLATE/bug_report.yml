name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened?, description: "What you did, what you expected, what you got." }
    validations: { required: true }
  - type: textarea
    id: doctor
    attributes: { label: Output of `npx layerwright doctor`, render: text }
  - type: textarea
    id: repro
    attributes: { label: Minimal reproduction, description: "An HTML snippet or Design Plan that reproduces it, if possible." }
  - type: input
    id: versions
    attributes: { label: Versions, placeholder: "layerwright 0.1.0 · Node 20.x · Figma desktop 125.x · macOS 15" }
    validations: { required: true }
