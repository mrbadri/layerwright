<!doctype html><html><head><meta charset="utf-8"><title>Effects</title>
<style>body{margin:0;font-family:Inter} .row{display:flex;gap:10px;padding:10px}
.a{width:80px;height:80px;background:radial-gradient(circle at center, #7C3AED 0%, #176B66 100%)}
.b{width:80px;height:80px;background:conic-gradient(from 90deg, #F59E0B, #EF4444, #F59E0B)}
.c{width:80px;height:80px;background:#176B66;filter:blur(4px)}
.d{width:80px;height:80px;background:rgba(255,255,255,.4);backdrop-filter:blur(12px)}</style></head>
<body><div class="row"><div class="a"></div><div class="b"></div><div class="c"></div><div class="d"></div></div></body></html>
