<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Sign in</title><link rel="stylesheet" href="fonts.css">
<style>
  body { display: flex; justify-content: center; padding: 80px 16px; }
  form { width: 360px; display: flex; flex-direction: column; gap: 16px; padding: 32px; background: #FFFFFF; border-radius: 20px; border: 1px solid #E2ECE8; }
  h2 { margin: 0; font-size: 24px; font-weight: 700; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #3D4D4E; }
  input { height: 44px; padding: 0 14px; border: 1px solid #C9D6D2; border-radius: 12px; font: inherit; font-size: 15px; }
  button { height: 48px; border: 0; border-radius: 24px; background: #176B66; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; }
  a { font-size: 13px; color: #176B66; text-align: center; }
</style></head><body>
<form><h2>Welcome back</h2>
  <label>Email<input type="email" placeholder="you@company.com"></label>
  <label>Password<input type="password" placeholder="••••••••"></label>
  <button type="button">Sign in</button><a href="#">Forgot password?</a></form>
</body></html>
