<!doctype html><html><head><meta charset="utf-8"><title>Colors</title>
<style>body{margin:0;font-family:Inter} .pill{display:inline-flex;padding:2px 8px;background:oklch(0.96 0.03 295);color:oklch(0.5 0.2 295);border:1px solid color-mix(in oklch, oklch(0.6 0.2 295) 40%, white);border-radius:999px}
.bar{position:relative;display:flex;justify-content:space-between;width:300px;padding:10px} .line{position:absolute;left:20px;right:20px;top:20px;height:2px;background:hsl(270 80% 60%)}
.dot{width:20px;height:20px;border-radius:10px;background:#16A34A}</style></head>
<body><span class="pill">در انتظار تو</span><div class="bar"><div class="line"></div><div class="dot"></div><div class="dot"></div></div></body></html>
