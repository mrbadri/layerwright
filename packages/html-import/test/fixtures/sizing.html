<!doctype html>
<html><head><meta charset="utf-8"><title>Sizing</title>
<style>
  body { margin: 0; font-family: Inter, Arial, sans-serif; }
  .card { display: flex; flex-direction: column; gap: 16px; padding: 24px; width: 360px; background: #fff; border: 1px solid #e5e7eb; }
  .row { display: flex; gap: 12px; align-items: center; }
  .tile { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; background: #eef; border-radius: 12px; }
  .step { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 16px; background: #176B66; color: #fff; font-size: 14px; }
  .chip { display: flex; padding: 4px 10px; background: #f3f4f6; border-radius: 999px; font-size: 12px; }
  .timeline { display: flex; gap: 8px; }
  .col { display: flex; flex-direction: column; align-items: center; }
  .circle { width: 22px; height: 22px; border-radius: 11px; background: #7C3AED; color: #fff; font-size: 11px; display: flex; align-items: center; justify-content: center; }
  .stem { width: 2px; height: 30px; background: #D0D5DD; }
</style></head>
<body>
  <div class="card">
    <div class="row">
      <div class="tile"><div class="sc-host-x" style="display:contents"><svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="#176B66"/></svg></div></div>
      <div class="step">1</div>
      <div class="chip">Draft</div>
    </div>
    <div class="timeline"><div class="col"><div class="circle">3</div><div class="stem"></div></div><div>تکمیل شواهد</div></div>
  </div>
</body></html>
