<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Acme</title><link rel="stylesheet" href="fonts.css">
<style>
  nav { display: flex; justify-content: space-between; align-items: center; padding: 16px 32px; background: #FFFFFF; border-bottom: 1px solid #E2ECE8; }
  .brand { font-weight: 700; font-size: 18px; }
  .links { display: flex; gap: 24px; font-size: 14px; }
  .hero { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 64px 32px; background: linear-gradient(180deg, #CFECE6, #F8FCFA); text-align: center; }
  h1 { margin: 0; font-size: 40px; line-height: 52px; font-weight: 700; letter-spacing: -0.4px; }
  .cta { display: flex; gap: 12px; }
  .btn { padding: 12px 20px; border-radius: 999px; font-size: 15px; border: 0; font-family: inherit; }
  .primary { background: #176B66; color: #FFFFFF; }
  .secondary { background: #FFFFFF; color: #176B66; border: 1px solid #176B66; }
  .grid { display: flex; gap: 24px; padding: 48px 32px; }
  .card { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 20px; background: #FFFFFF; border-radius: 16px; box-shadow: 0 8px 24px -12px rgba(23,37,39,.3); }
  .card h3 { margin: 0; font-size: 17px; font-weight: 700; }
  .card p { margin: 0; font-size: 14px; line-height: 22px; color: #61706E; }
</style></head><body>
<nav><div class="brand">Acme</div><div class="links"><a>Features</a><a>Pricing</a><a>Docs</a></div></nav>
<section class="hero"><h1>Ship designs faster</h1><p style="margin:0;font-size:17px;color:#3D4D4E">From prototype to Figma in one step.</p>
  <div class="cta"><button class="btn primary">Get started</button><button class="btn secondary">Learn more</button></div></section>
<section class="grid">
  <div class="card"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#0F7F79"/></svg><h3>Auto Layout</h3><p>Flexbox becomes native Auto Layout.</p></div>
  <div class="card"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#F4C44D"/></svg><h3>Components</h3><p>Buttons map to your Design System.</p></div>
  <div class="card"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#D65A68"/></svg><h3>Tokens</h3><p>Colors and radii stay consistent.</p></div>
</section></body></html>
