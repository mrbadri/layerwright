<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>لیست آرزو</title><link rel="stylesheet" href="fonts.css">
<style>
  header { display: flex; align-items: center; gap: 12px; padding: 16px 20px; background: #CFECE6; }
  .owner { font-size: 14px; font-weight: 700; color: #176B66; }
  .count { font-size: 13px; color: #61706E; }
  main { display: flex; flex-direction: column; gap: 12px; padding: 20px; }
  h1 { margin: 0; font-size: 28px; line-height: 40px; font-weight: 700; }
  .row { display: flex; gap: 8px; }
  .chip { padding: 6px 12px; border-radius: 16px; background: #F4C44D; font-size: 13px; }
  .tag { align-self: flex-start; padding: 10px 16px; border-radius: 20px; background: #0F7F79; color: #FFFFFF; font-size: 13px; border: 0; font-family: inherit; }
</style></head><body>
<header><span class="owner">لیست آرزوهای سارا</span><span class="count">۸ آرزو</span></header>
<main><h1>تولد سی‌سالگی سارا</h1>
  <div class="row"><span class="chip">تولد</span><span class="chip">۱۲ آبان</span><span class="chip">۳۶ روز مونده</span></div>
  <p style="margin:0;font-size:15px;line-height:28px">مرسی که به فکرمی! هر کدوم رو خواستی انتخاب کن.</p>
  <button class="tag">این کادو با من</button></main>
</body></html>
